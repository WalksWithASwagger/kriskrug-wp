<!-- Tiny progressive enhancer (optional). Prefer theme JS enqueue in Track B apply.
     Inline sketch kept here so behavior is reviewable without shipping theme JS yet. -->
<script>
(function () {
  var root = document.getElementById('clients');
  if (!root) return;
  var readout = document.getElementById('aurora-logo-soup-readout');
  var items = root.querySelectorAll('.aurora-logo-soup__item');
  var empty = 'Hover or focus a logo.';
  function setActive(btn) {
    items.forEach(function (el) { el.classList.toggle('is-active', el === btn); });
    if (!readout) return;
    readout.textContent = btn
      ? (btn.getAttribute('aria-label') + ': ' + (btn.getAttribute('data-note') || ''))
      : empty;
  }
  items.forEach(function (btn) {
    btn.addEventListener('mouseenter', function () { setActive(btn); });
    btn.addEventListener('focus', function () { setActive(btn); });
    btn.addEventListener('click', function () {
      setActive(btn.classList.contains('is-active') && matchMedia('(hover: none)').matches ? null : btn);
    });
  });
  root.addEventListener('mouseleave', function () {
    if (!root.querySelector('.aurora-logo-soup__item:focus')) setActive(null);
  });
})();
</script>
