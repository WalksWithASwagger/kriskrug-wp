name: Agent safe merge

# Opt-in merge path for Cloud agents blocked by branch protection.
# The Cursor GitHub App installation token cannot create approving reviews
# (`addPullRequestReview` → Resource not accessible by integration), so
# `gh pr merge` fails even when CI is green.
#
# Fix: a human-owned PAT (repo secret AGENT_MERGE_TOKEN) approves + squash-
# merges when the PR carries the `agent-safe-merge` label and CI is green.
# Theme / plugin / snippet paths are refused here — those stay manual.

on:
  pull_request:
    types: [labeled, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to merge
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: agent-safe-merge-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  merge:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       !github.event.pull_request.draft &&
       contains(join(github.event.pull_request.labels.*.name, ','), 'agent-safe-merge'))
    runs-on: ubuntu-latest
    steps:
      - name: Require AGENT_MERGE_TOKEN
        env:
          AGENT_MERGE_TOKEN: ${{ secrets.AGENT_MERGE_TOKEN }}
        run: |
          if [ -z "${AGENT_MERGE_TOKEN}" ]; then
            echo "::error::Repo secret AGENT_MERGE_TOKEN is missing."
            echo "Create a classic PAT (scopes: repo) owned by an account with write access,"
            echo "then add it as Actions secret AGENT_MERGE_TOKEN."
            echo "Also add the same value as Cursor Cloud secret GH_TOKEN so agents can merge from the pod."
            exit 1
          fi

      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Approve + squash merge (guarded)
        env:
          GH_TOKEN: ${{ secrets.AGENT_MERGE_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          meta=$(gh pr view "$PR" --json number,isDraft,state,mergeable,url,files,labels,statusCheckRollup,title)
          echo "$meta" | jq '{number,title,isDraft,state,mergeable,labels:[.labels[].name]}'

          echo "$meta" | jq -e '.state=="OPEN"' >/dev/null
          echo "$meta" | jq -e '.isDraft==false' >/dev/null
          echo "$meta" | jq -e 'any(.labels[].name; .=="agent-safe-merge")' >/dev/null

          # Hard refuse live-render / deploy surfaces.
          blocked=$(echo "$meta" | jq -r '
            [.files[].path
             | select(startswith("theme/")
                   or startswith("plugins/")
                   or startswith("inc/")
                   or .=="functions.php")]
            | unique | .[]
          ')
          if [ -n "$blocked" ]; then
            echo "::error::agent-safe-merge refuses theme/plugins/inc paths:"
            echo "$blocked"
            exit 1
          fi

          # All completed checks must be SUCCESS or SKIPPED; none pending/failing.
          bad=$(echo "$meta" | jq -r '
            [.statusCheckRollup[]?
             | select((.status!="COMPLETED")
                   or (.conclusion!="SUCCESS" and .conclusion!="SKIPPED" and .conclusion!="NEUTRAL"))]
            | map("\(.name)=\(.status)/\(.conclusion // "null")") | .[]
          ')
          if [ -n "$bad" ]; then
            echo "::error::CI not green yet:"
            echo "$bad"
            exit 1
          fi
          echo "$meta" | jq -e '
            ([.statusCheckRollup[]? | select(.name=="summary" or .name=="Test PR / summary")] | length) > 0
            and all(
              .statusCheckRollup[]?
              | select(.name=="summary" or .name=="Test PR / summary");
              .status=="COMPLETED" and .conclusion=="SUCCESS"
            )
          ' >/dev/null

          echo "$meta" | jq -e '.mergeable=="MERGEABLE"' >/dev/null

          # Approving review from the PAT owner (write access) satisfies branch protection.
          gh pr review "$PR" --approve --body "agent-safe-merge: CI green, no theme/plugins/inc paths. Approved via AGENT_MERGE_TOKEN."

          gh pr merge "$PR" --squash --delete-branch

          echo "Merged #$PR"
